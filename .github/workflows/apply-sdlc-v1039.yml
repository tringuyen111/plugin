name: Apply SDLC Intelligence v1.0.39 candidate

on:
  push:
    branches:
      - agent/sdlc-intelligence-v1.0.39-bootstrap
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified release patch
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .sync/release-v1039.patch.gz.b64.part00 \
            .sync/release-v1039.patch.gz.b64.mid-00 \
            .sync/release-v1039.patch.gz.b64.mid-01 \
            .sync/release-v1039.patch.gz.b64.mid-02 \
            .sync/release-v1039.patch.gz.b64.mid-03 \
            .sync/release-v1039.patch.gz.b64.part03 \
            | base64 -d | gzip -d > /tmp/release-v1039.patch
          echo "b430dccc41d1199a0d8950511f637efe1d91f3c264e89fe0493a3dc9c4e4cc92  /tmp/release-v1039.patch" | sha256sum -c -
          git apply --check /tmp/release-v1039.patch
          git apply --index /tmp/release-v1039.patch
          rm -rf .sync
          rm -f .github/workflows/apply-sdlc-v1039.yml
          git add -A
          python3 plugins/sdlc-intelligence-deep/scripts/skill-state.py check
          printf '{"source":"startup"}\n' | python3 plugins/sdlc-intelligence-deep/hooks/session_start.py > /tmp/session-start.json
          python3 -c "import json; p=json.load(open('/tmp/session-start.json', encoding='utf-8')); assert p['continue'] is True; assert p['hookSpecificOutput']['hookEventName'] == 'SessionStart'; assert p['hookSpecificOutput']['additionalContext']"
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Apply SDLC Intelligence v1.0.39 candidate"
          TARGET_BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          git push origin "HEAD:${TARGET_BRANCH}"
