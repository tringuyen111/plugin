    <path d="M279 157 218 268h42l-25 92 67-119h-43z" fill="url(#bolt)" stroke="#efffff" stroke-opacity="0.78" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <g fill="#f4ffff" opacity="0.9" filter="url(#softGlow)">
    <path d="M114 121h5v16h-5z" transform="rotate(-35 116.5 129)"/>
    <path d="M106 127h16v5h-16z" transform="rotate(-35 114 129.5)"/>
    <path d="M400 383h4v14h-4z" transform="rotate(30 402 390)"/>
    <path d="M395 388h14v4h-14z" transform="rotate(30 402 390)"/>
  </g>
</svg>
