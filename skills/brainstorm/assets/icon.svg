<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Brainstorm</title>
  <desc id="desc">A luminous neural brain orbiting an electric idea spark.</desc>
  <defs>
    <linearGradient id="bg" x1="64" y1="52" x2="448" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#07152f"/>
      <stop offset="0.52" stop-color="#11133d"/>
      <stop offset="1" stop-color="#26104a"/>
    </linearGradient>
    <linearGradient id="brain" x1="128" y1="128" x2="386" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#57e4ff"/>
      <stop offset="0.48" stop-color="#6f8cff"/>
      <stop offset="1" stop-color="#c869ff"/>
    </linearGradient>
    <linearGradient id="bolt" x1="229" y1="165" x2="292" y2="348" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f6ffff"/>
      <stop offset="0.45" stop-color="#8ff7ff"/>
      <stop offset="1" stop-color="#8c6cff"/>
    </linearGradient>
    <linearGradient id="orbit" x1="75" y1="167" x2="437" y2="346" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#49dfff" stop-opacity="0.12"/>
      <stop offset="0.25" stop-color="#49dfff" stop-opacity="0.95"/>
      <stop offset="0.62" stop-color="#8978ff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#d563ff" stop-opacity="0.14"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(256 256) rotate(90) scale(180)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4ce7ff" stop-opacity="0.24"/>
      <stop offset="0.48" stop-color="#796fff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#8d4cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="18" y="18" width="476" height="476" rx="126" fill="url(#bg)"/>
  <rect x="25" y="25" width="462" height="462" rx="119" fill="none" stroke="#9feaff" stroke-opacity="0.13" stroke-width="2"/>
  <circle cx="256" cy="256" r="184" fill="url(#halo)"/>

  <g fill="none" stroke-linecap="round">
    <ellipse cx="256" cy="256" rx="190" ry="116" transform="rotate(-16 256 256)" stroke="url(#orbit)" stroke-width="5"/>
    <ellipse cx="256" cy="256" rx="167" ry="91" transform="rotate(23 256 256)" stroke="#7eefff" stroke-opacity="0.15" stroke-width="2"/>
  </g>

  <g filter="url(#softGlow)">
