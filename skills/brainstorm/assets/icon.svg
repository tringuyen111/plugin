    <circle cx="151" cy="194" r="6"/>
    <circle cx="194" cy="232" r="6"/>
    <circle cx="150" cy="267" r="6"/>
    <circle cx="190" cy="304" r="6"/>
    <circle cx="176" cy="355" r="6"/>
    <circle cx="216" cy="206" r="6"/>
    <circle cx="212" cy="368" r="6"/>
    <circle cx="361" cy="194" r="6"/>
    <circle cx="318" cy="232" r="6"/>
    <circle cx="362" cy="267" r="6"/>
    <circle cx="322" cy="304" r="6"/>
    <circle cx="336" cy="355" r="6"/>
    <circle cx="296" cy="206" r="6"/>
    <circle cx="300" cy="368" r="6"/>
  </g>

