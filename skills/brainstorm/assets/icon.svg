    <path d="M133 293c21-9 42-5 57 11-14 15-19 33-14 51"/>
    <path d="M190 160c-2 20 7 36 26 46-15 11-21 27-18 47"/>
    <path d="M181 284c24 0 41 12 49 34-14 13-20 30-18 50"/>
    <path d="M361 194c-24 2-38 16-43 38 23 1 39 15 44 35"/>
    <path d="M379 293c-21-9-42-5-57 11 14 15 19 33 14 51"/>
    <path d="M322 160c2 20-7 36-26 46 15 11 21 27 18 47"/>
    <path d="M331 284c-24 0-41 12-49 34 14 13 20 30 18 50"/>
  </g>

